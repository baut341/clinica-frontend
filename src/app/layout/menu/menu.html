<div class="titulo-menu">
  <span class="rol">{{ etiquetaRol() }}</span>
</div>

<mat-nav-list>
  <a
    mat-list-item
    routerLink="/"
    routerLinkActive="activo"
    [routerLinkActiveOptions]="{ exact: true }"
    (click)="navego.emit()"
  >
    <mat-icon matListItemIcon>home</mat-icon>
    <span matListItemTitle>Inicio</span>
  </a>

  <mat-divider />

  @for (opcion of opciones(); track opcion.ruta) {
    <a
      mat-list-item
      [routerLink]="opcion.ruta"
      routerLinkActive="activo"
      (click)="navego.emit()"
    >
      <mat-icon matListItemIcon>{{ opcion.icono }}</mat-icon>
      <span matListItemTitle>{{ opcion.texto }}</span>
    </a>
  }

  <mat-divider />

  <a mat-list-item routerLink="/perfil" routerLinkActive="activo" (click)="navego.emit()">
    <mat-icon matListItemIcon>person</mat-icon>
    <span matListItemTitle>Mi perfil</span>
  </a>
</mat-nav-list>
