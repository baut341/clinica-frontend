<mat-toolbar color="primary" class="barra">
  @if (estaLogueado()) {
    <button
      matIconButton
      aria-label="Abrir el menú de navegación"
      (click)="alternarMenu.emit()"
    >
      <mat-icon>menu</mat-icon>
    </button>
  }

  <a class="marca" routerLink="/">
    <mat-icon>local_hospital</mat-icon>
    <span>Clínica Virtual</span>
  </a>

  <span class="espaciador"></span>

  @if (estaLogueado()) {
    <button
      matIconButton
      class="campana"
      aria-label="Notificaciones"
      matTooltip="Notificaciones: disponibles próximamente"
    >
      <mat-icon>notifications</mat-icon>
    </button>

    <mat-icon class="info-rol" [matTooltip]="'Tipo de usuario: ' + etiquetaRol()">
      info
    </mat-icon>

    <button matButton [matMenuTriggerFor]="menuUsuario" class="usuario">
      <mat-icon>account_circle</mat-icon>
      <span class="nombre">{{ nombreCompleto() }}</span>
      <mat-icon>arrow_drop_down</mat-icon>
    </button>

    <mat-menu #menuUsuario="matMenu">
      <div class="encabezado-menu" mat-menu-item disabled>
        <span>{{ etiquetaRol() }}</span>
      </div>
      <a mat-menu-item routerLink="/perfil">
        <mat-icon>person</mat-icon>
        <span>Mi perfil</span>
      </a>
      <button mat-menu-item (click)="cerrarSesion()">
        <mat-icon>logout</mat-icon>
        <span>Cerrar sesión</span>
      </button>
    </mat-menu>
  } @else {
    <span class="bienvenida">Bienvenido a la clínica virtual</span>
    <a matButton routerLink="/login">Iniciar sesión</a>
    <a matButton="filled" routerLink="/registro">Registrarse</a>
  }
</mat-toolbar>
